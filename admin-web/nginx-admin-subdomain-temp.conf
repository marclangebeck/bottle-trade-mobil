# Temporäre Nginx-Konfiguration für admin.bottle-trade.de (OHNE SSL)
# Diese wird verwendet, bis Certbot das SSL-Zertifikat erstellt hat
# Nach Certbot wird diese Datei automatisch aktualisiert

server {
    listen 80;
    server_name admin.bottle-trade.de;

    # Root-Verzeichnis für Admin-Web-App
    root /home/bottleadmin/bottle-trade-mobile/admin-web/dist;
    index index.html;

    # Alle Requests an index.html weiterleiten (für React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache-Control für statische Assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}











