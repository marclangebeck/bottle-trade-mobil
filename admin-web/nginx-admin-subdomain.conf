# Nginx-Konfiguration für admin.bottle-trade.de
# Diese Datei muss nach /etc/nginx/sites-available/admin.bottle-trade.de kopiert werden
# und dann mit sudo ln -s /etc/nginx/sites-available/admin.bottle-trade.de /etc/nginx/sites-enabled/admin.bottle-trade.de verlinkt werden

server {
    listen 80;
    server_name admin.bottle-trade.de;

    # Redirect HTTP zu HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.bottle-trade.de;

    # SSL-Zertifikat (wird von Certbot verwaltet)
    ssl_certificate /etc/letsencrypt/live/admin.bottle-trade.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.bottle-trade.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Root-Verzeichnis für Admin-Web-App
    root /home/bottleadmin/bottle-trade-mobile/admin-web/dist;
    index index.html;

    # Alle Requests an index.html weiterleiten (für React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache-Control für statische Assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}

