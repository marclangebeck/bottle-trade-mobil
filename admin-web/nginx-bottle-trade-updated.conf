# Aktualisierte Nginx-Konfiguration für bottle-trade.de
# Diese Datei ersetzt /etc/nginx/sites-available/bottle-trade.de
# 
# WICHTIG: Erstelle zuerst ein Backup!
# sudo cp /etc/nginx/sites-available/bottle-trade.de /etc/nginx/sites-available/bottle-trade.de.backup
#
# Dann kopiere diese Datei:
# sudo cp ~/bottle-trade-mobile/admin-web/nginx-bottle-trade-updated.conf /etc/nginx/sites-available/bottle-trade.de
#
# Teste die Konfiguration:
# sudo nginx -t
#
# Lade Nginx neu:
# sudo systemctl reload nginx

server {
    server_name bottle-trade.de www.bottle-trade.de;

    # NEUE Admin-Web-App unter /admin (MUSS VOR location / stehen!)
    location /admin {
        alias /home/bottleadmin/bottle-trade-mobile/admin-web/dist;
        try_files $uri $uri/ /admin/index.html;
        
        # Cache-Control für statische Assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Bestehende Flask-App (Haupt-Domain)
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO für Flask-App
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Statische Dateien für Flask-App
    location /static {
        alias /home/bottleadmin/bottle-trade/app/static/;
    }

    # Uploads für Flask-App
    location /uploads {
        alias /home/bottleadmin/bottle-trade/instance/uploads;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/bottle-trade.de/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/bottle-trade.de/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = bottle-trade.de) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name bottle-trade.de www.bottle-trade.de;
    return 404; # managed by Certbot
}








