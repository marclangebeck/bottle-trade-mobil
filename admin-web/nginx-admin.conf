# Nginx-Konfiguration für Admin-Web unter /admin
# Diese Datei muss nach /etc/nginx/sites-available/admin-web kopiert werden
# und dann mit sudo ln -s /etc/nginx/sites-available/admin-web /etc/nginx/sites-enabled/ verlinkt werden

server {
    listen 80;
    server_name bottle-trade.de www.bottle-trade.de;

    # Admin-Web unter /admin
    location /admin {
        alias /home/bottleadmin/bottle-trade-mobile/admin-web/dist;
        try_files $uri $uri/ /admin/index.html;
        
        # CORS Headers (falls nötig)
        add_header Access-Control-Allow-Origin *;
        
        # Cache-Control für statische Assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Bestehende Konfiguration für Haupt-Domain bleibt erhalten
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

